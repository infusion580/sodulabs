services:
  sodulabs:
    image: infusion580/sodulabs:latest
    container_name: sodulabs
    restart: unless-stopped
    networks:
      - defender_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=defender_default
      - traefik.http.routers.sodulabs.rule=Host(`sudolabsmx.shop`)
      - traefik.http.routers.sodulabs.entrypoints=websecure
      - traefik.http.routers.sodulabs.tls=true
      - traefik.http.routers.sodulabs.tls.certresolver=letsencrypt
      - traefik.http.services.sodulabs.loadbalancer.server.port=80

networks:
  defender_default:
    external: true
